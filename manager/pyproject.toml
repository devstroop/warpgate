[project]
name = "warp-proxy-manager"
version = "0.2.0"
description = "REST API to manage warp-proxy Docker containers"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.mypy]
strict = true
python_version = "3.12"
