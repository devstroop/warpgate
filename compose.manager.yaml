services:
  manager:
    build: ./manager
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATA_DIR: /data
      WARP_IMAGE: warp-proxy:latest
      HOST: "${HOST:-127.0.0.1}"
      SOCKS_BASE: "1080"
      HTTP_BASE: "3128"
      MAX_INSTANCES: "10"
      MANAGER_API_KEY: "${MANAGER_API_KEY:-}"
      DOCKER_TIMEOUT: "60"
      STOP_TIMEOUT: "10"
    volumes:
      - manager-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  manager-data:
