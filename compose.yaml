services:
  warp-proxy:
    build: .
    image: warp-proxy:latest
    ports:
      - "1080:1080"
      - "3128:3128"
    environment:
      WARP_IP_CACHE: /var/cache/warp-ip.txt
      WARP_WAIT_RETRIES: "30"
      WARP_WAIT_INTERVAL: "2"
    volumes:
      - warp-data:/var/lib/cloudflare-warp
      - warp-cache:/var/cache
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
    devices:
      - /dev/net/tun
    restart: unless-stopped

volumes:
  warp-data:
  warp-cache:
