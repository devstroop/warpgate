services:
  warpgate:
    build: .
    image: warpgate:local
    restart: unless-stopped
    ports:
      - "1080:1080"
      - "3128:3128"
    environment:
      WARP_WAIT_RETRIES: "15"
      WARP_WAIT_INTERVAL: "2"
    volumes:
      - warpgate-data:/var/lib/cloudflare-warp
      - warpgate-cache:/var/cache
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
    devices:
      - /dev/net/tun

volumes:
  warpgate-data:
  warpgate-cache:
