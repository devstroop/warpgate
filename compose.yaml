services:
  warpgate:
    build: .
    image: warpgate:local
    restart: unless-stopped
    ports:
      - "1080:1080"
      - "3128:3128"
    environment:
      WARP_WAIT_RETRIES: "15"
      WARP_WAIT_INTERVAL: "2"
    volumes:
      - warpgate-data:/var/lib/cloudflare-warp
      - warpgate-cache:/var/cache
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
    devices:
      - /dev/net/tun
    networks:
      - warpgate-net

  manager:
    build: ./manager
    image: warpgate-manager:local
    restart: unless-stopped
    ports:
      - "9090:9090"
    environment:
      WARPATE_IMAGE: "warpgate:local"
      WARPATE_PREFIX: "warpgate-"
      WARPATE_COUNT: "3"
      # Network name as created by Docker Compose: <project>_<network>
      # Default project name from directory is "warpgate".
      WARPATE_NETWORK: "warpgate_warpgate-net"
      MANAGER_PORT: "9090"
      # Set a strong random key to protect the management API:
      # MANAGER_API_KEY: "change-me"
    volumes:
      # Requires Docker socket access to manage containers.
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - warpgate-net

networks:
  warpgate-net:
    driver: bridge

volumes:
  warpgate-data:
  warpgate-cache:
