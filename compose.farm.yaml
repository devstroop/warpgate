services:
  warp-proxy:
    build: .
    ports:
      - "1080:1080"
      - "3128:3128"
    environment:
      WARP_IP_CACHE: /var/cache/warp-ip.txt
      WARP_WAIT_RETRIES: "30"
      WARP_WAIT_INTERVAL: "2"
    volumes:
      - warp-data:/var/lib/cloudflare-warp
      - warp-cache:/var/cache
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
    devices:
      - /dev/net/tun
    restart: unless-stopped

  manager:
    build: ./manager
    ports:
      - "8000:8000"
    environment:
      DATA_DIR: /data
      WARP_IMAGE: warp-proxy:latest
      SOCKS_BASE: "1080"
      HTTP_BASE: "3128"
      MAX_INSTANCES: "10"
      MANAGER_API_KEY: "${MANAGER_API_KEY:-}"
      DOCKER_TIMEOUT: "60"
      STOP_TIMEOUT: "10"
    volumes:
      - manager-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    depends_on:
      - warp-proxy

volumes:
  warp-data:
  warp-cache:
  manager-data:
