x-warpgate-template: &warpgate-template
  build:
    context: .
    dockerfile: Dockerfile
  image: warpgate:local
  restart: unless-stopped
  cap_add:
    - NET_ADMIN
    - SYS_ADMIN
  sysctls:
    - net.ipv6.conf.all.disable_ipv6=0
  devices:
    - /dev/net/tun

services:
  ngnix:
    image: nginx:alpine
    ports:
      - "1080:1080"
      - "3128:3128"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker-entrypoint-nginx.sh:/docker-entrypoint-nginx.sh:ro
    entrypoint: ["/bin/sh", "/docker-entrypoint-nginx.sh"]
    depends_on:
      - warpgate
    networks:
      - warpgate_network
    restart: unless-stopped

  # Single service — scale with: docker compose up -d --scale warpgate=N
  # nginx uses DNS resolver to discover instances dynamically
  warpgate:
    <<: *warpgate-template
    networks:
      - warpgate_network

networks:
  warpgate_network:
    external: true