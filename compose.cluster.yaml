x-warpgate-template: &warpgate-template
  build:
    context: .
    dockerfile: Dockerfile
  image: warpgate:local
  restart: unless-stopped
  cap_add:
    - NET_ADMIN
  sysctls:
    - net.ipv6.conf.all.disable_ipv6=0
  devices:
    - /dev/net/tun

services:
  nginx:
    image: nginx:alpine
    ports:
      - "1080:1080"
      - "3128:3128"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./entrypoint-nginx.sh:/entrypoint-nginx.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint-nginx.sh"]
    depends_on:
      - warpgate
    networks:
      - warpgate_network
    restart: unless-stopped

  # Single service — scale with: docker compose up -d --scale warpgate=N
  # nginx uses DNS resolver to discover instances dynamically
  warpgate:
    <<: *warpgate-template
    environment:
      WARP_WAIT_RETRIES: "30"
      WARP_WAIT_INTERVAL: "2"
      WARP_CLIENT_SECRET: ${WARP_CLIENT_SECRET:-}
    networks:
      - warpgate_network

# NOTE: Create the network before first run:
#   docker network create warpgate_network
networks:
  warpgate_network:
    external: true
