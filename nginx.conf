events {
    worker_connections 1024;
}

stream {
    resolver 127.0.0.11 valid=5s;

    # DNS-based dynamic upstream — scale with: docker compose up -d --scale warpgate=N
    upstream warp_socks {
        least_conn;
        zone warp_socks 64k;
        server warpgate:1080 resolve max_fails=3 fail_timeout=30s;
    }
    server {
        listen 1080;
        proxy_pass warp_socks;
        proxy_connect_timeout 10s;
        proxy_timeout 120s;
    }

    upstream warpgate_http {
        least_conn;
        zone warpgate_http 64k;
        server warpgate:3128 resolve max_fails=3 fail_timeout=30s;
    }
    server {
        listen 3128;
        proxy_pass warpgate_http;
        proxy_connect_timeout 10s;
        proxy_timeout 120s;
    }
}